html,body{margin:0;height:100%}
body{background:#0b0b0c;display:grid;place-items:center;font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace}
body:has(.stage:not(.show)){place-items:end center}
.stage{--canvas:100vmin;--scale-unit:calc(var(--canvas)*0.001);--sz-02:calc(var(--scale-unit)*2);--sz-15:calc(var(--scale-unit)*15);--sz-20:calc(var(--scale-unit)*20);--sz-30:calc(var(--scale-unit)*30);--sz-90:calc(var(--scale-unit)*90);--bw:max(1px,var(--sz-02));--band-h:calc(var(--scale-unit)*180);--ink:rgb(var(--ink-rgb,20,20,20));--ink-muted:rgba(var(--ink-rgb,20,20,20),.5);width:var(--canvas);height:var(--canvas);position:relative;overflow:hidden;box-sizing:border-box;display:flex;background:var(--bg,#0b0b0c)}
.stage.show{padding:var(--sz-20)}
.frame{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg,#0b0b0c)}
.stage.show .frame{border:var(--bw) solid var(--ink)}
.art-box{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art-box svg{height:100%;width:auto;max-width:100%;display:block}
.band{flex:0 0 auto;box-sizing:border-box;height:var(--band-h);display:none;border-top:var(--bw) solid var(--ink)}
.stage.show .band{display:flex}
.poster-title,.watermark{position:absolute;display:none}
.stage.show .poster-title,.stage.show .watermark{display:block}
.poster-title{top:var(--sz-20);left:var(--sz-20);color:var(--ink);text-transform:uppercase;z-index:10}
.poster-title-label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.poster-title-value{font-size:var(--sz-30);line-height:1;color:var(--ink);white-space:nowrap}
.watermark{right:var(--sz-20);bottom:calc(var(--band-h) + var(--sz-20));width:var(--sz-90);height:var(--sz-30);z-index:3;pointer-events:none}
.watermark svg{display:block;width:100%;height:100%;fill:var(--ink-muted)}
.export-bar{position:absolute;top:var(--sz-20);right:var(--sz-20);display:none;gap:calc(var(--scale-unit)*10);align-items:center;z-index:10}
.stage.show .export-bar{display:flex}
.export-bar .button{display:flex;align-items:center;gap:var(--sz-02);padding:calc(var(--scale-unit)*5) calc(var(--scale-unit)*7) calc(var(--scale-unit)*5) calc(var(--scale-unit)*10);border:var(--bw) solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);text-decoration:none;font:inherit;font-size:var(--sz-15);text-transform:uppercase;letter-spacing:.08em;line-height:1;-webkit-user-select:none;user-select:none;cursor:pointer}
.export-bar .button .icon{width:calc(var(--scale-unit)*16);height:calc(var(--scale-unit)*16);fill:currentColor;display:block;flex-shrink:0}
.export-bar .button:active{background:var(--ink);color:var(--bg,#0b0b0c)}
.export-bar .button[aria-busy="true"]{cursor:progress}
.export-bar .button.gif-busy{animation:gpulse .9s ease-in-out infinite}
@keyframes gpulse{50%{border-color:var(--ink-muted)}}
.swatch{flex:0 0 auto;box-sizing:border-box;width:calc(var(--band-h) - var(--bw));height:calc(var(--band-h) - var(--bw));padding:var(--sz-20);display:flex;align-items:flex-end;justify-content:center;border-right:var(--bw) solid var(--ink)}
.bars{display:flex;flex-direction:row;align-items:flex-end;width:100%;height:100%}
.cbar{flex:1 0 0;min-width:0}
.cbar.unused{aspect-ratio:1;height:auto}
.data{flex:1;display:flex;flex-direction:column;min-width:0}
.drow{display:flex;flex:1;min-width:0;min-height:0}
.drow.top{border-bottom:var(--bw) solid var(--ink)}
.cell{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--sz-02)*1.4);padding:var(--sz-20);border-right:var(--bw) solid var(--ink);min-width:0;min-height:0;overflow:hidden}
.cell:last-child{border-right:none}
.cell.fill{flex:1 0 auto}
.cell.msg{flex:0 1 auto;min-width:0}
.cell.hug{flex:0 0 auto}
.label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.value{font-size:var(--sz-30);line-height:1;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.msgv{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;outline:none;cursor:text}
.msgv:empty:before{content:attr(data-ph);opacity:.4}

#game .sizelab .gl{font-size:13px}
#game .sizelab .gl b{margin-right:6px}
#game .hint{position:absolute;left:50%;top:calc(100% - 50px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);font-size:11px;line-height:1.5;opacity:.6;text-align:center;text-wrap:balance}
#game .hint.caps{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 16px;opacity:.85;transition:opacity .6s}
#game .hint.gone{opacity:0}
#game.touch .hint{transition:opacity .6s}
#game .hint.caps,#game .exit{font:400 10px 'Space Mono',ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em}
#game .hint .g,#game .exit .g{display:inline-flex;align-items:center;gap:4px}
#game .hint .t,#game .exit .t{margin-left:3px}
#game .exit .sl{opacity:.6;margin:0 1px}
#game .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(5,6,10,.74);text-align:center;color:#fff;pointer-events:auto;padding:24px}
#game .overlay h2{margin:0;font-size:26px;font-weight:700;letter-spacing:.03em}
#game .overlay p{margin:0;opacity:.82;font-size:13px;line-height:1.5;max-width:380px;text-wrap:pretty}
#game .overlay button{margin-top:10px;padding:11px 22px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:999px;font:600 13px ui-monospace,monospace;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;display:inline-flex;align-items:center;gap:10px}
#game:not(.touch) .overlay button:has(kbd){padding-right:10px}
#game .hint kbd,#game .exit kbd,#game .overlay button kbd{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;width:18px;height:18px;padding:0;border:1px solid currentColor;border-radius:5px;font:400 10px 'Space Mono',ui-monospace,monospace;letter-spacing:0;text-transform:uppercase}
#game .overlay button kbd{opacity:.85}
#game .hint kbd.w,#game .exit kbd.w,#game .overlay button kbd.w{width:auto;padding:0 5px}
#game .overlay button:active{background:#fff;color:#05060a}
#game .overlay .grade{font:800 15px ui-monospace,monospace;letter-spacing:.24em;margin:0}
#game .overlay .medal{line-height:0;margin:0}
#game .overlay .medal:empty,#game .overlay .grade:empty{display:none}
#game .overlay p.wel{margin:0 0 -2px;font:700 12px ui-monospace,monospace;letter-spacing:.32em;text-transform:uppercase;opacity:.8}
#game .overlay .logo{width:min(400px,76vw,80vh);aspect-ratio:2/1;margin:0;line-height:0;pointer-events:none}
#game .overlay .logo canvas{display:block;width:100%!important;height:100%!important}
#game .overlay .logo .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#game .hidden{display:none}
#game .tpad{display:none}
#game.touch{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game.touch .tpad{display:block;position:absolute;inset:0;touch-action:none}

#game .stick.on{bottom:auto;margin:-60px 0 0 -60px;opacity:1;transition:none}
#game .stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#game .tpad button{display:grid;place-items:center;padding:0;color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent}
#game .tpad button svg{display:block;fill:currentColor}
#game .hopb{position:absolute;right:calc(26px + env(safe-area-inset-right));bottom:calc(46px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12)}

#game .hopb.on{background:#fff;color:#05060a}

#game .tbtns button{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
#game .tbtns button svg{width:18px;height:18px}
#game .tbtns button:active{background:#fff;color:#05060a}
#game.touch .exit,#game.touch .overlay button kbd{display:none}
#game.touch .traits{top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left))}
#game.touch .timer{top:calc(14px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right))}
#game.touch .sizebar{bottom:calc(60px + env(safe-area-inset-bottom))}
#game.touch .sizelab{bottom:calc(80px + env(safe-area-inset-bottom))}
