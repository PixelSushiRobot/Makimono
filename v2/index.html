<meta charset="utf-8">
<!-- V2 PREVIEW (GitHub Pages, makimono.psr.fyi/v2/) -- the player (../index.html) plus B-SIDE: an alternate take on each minted token, drawn with gentler rules (see CHANGES.md), offered only when it looks visibly different. Also a ⋯ menu, keyboard shortcuts (? shows them) and keycap hints in the game. With B-SIDE off the art is exactly the player's, so exactly the minted art. Not for minting: it loads three.js (after the art is drawn) and Space Mono from the web. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400&text=%23&display=swap"><!-- just the # from Space Grotesk: it sits at cap height, unlike Space Mono's. Used where a name has a # (the wallet list) -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><!-- maximum-scale=1: iOS Safari otherwise zooms in when the seed field (under 16px) is focused; pinch zoom still works on iOS -->
<meta name="theme-color" content="#0b0b0c">
<title>Makimono</title>
<meta name="apple-mobile-web-app-title" content="Makimono"><link rel="apple-touch-icon" sizes="180x180" id="mkmnIcon"><link rel="icon" type="image/png" sizes="48x48" id="mkmnFav48"><link rel="icon" type="image/png" sizes="180x180" id="mkmnFav"><!-- home-screen and tab icon, no default image: the script at the end draws them from the piece on screen -->
<style>
/* Space Mono (regular only) comes from Google Fonts, linked in the head. The mint build embeds it instead: the network is blocked on chain. */
html,body{margin:0;height:100%}
body{background:#0b0b0c;display:grid;place-items:center;font-family:'Space Mono',ui-monospace,Menlo,Consolas,monospace}
body:has(.stage:not(.show)){place-items:end center}/* art alone sits at the bottom of the screen (portrait), the piece's colour filling above; with the traits shown it's centred */
/* The piece lives in a square stage. Normally the art fills it; adding .show (via the "i" key) shrinks the art up and reveals the traits band below, everything inside the square. All sizing derives from --canvas (the square side) so it scales with the viewport. Ink = the piece's nori color. */
.stage{--canvas:100vmin;--scale-unit:calc(var(--canvas)*0.001);--sz-02:calc(var(--scale-unit)*2);--sz-15:calc(var(--scale-unit)*15);--sz-20:calc(var(--scale-unit)*20);--sz-30:calc(var(--scale-unit)*30);--sz-90:calc(var(--scale-unit)*90);--bw:max(1px,var(--sz-02));--band-h:calc(var(--scale-unit)*180);--ink:rgb(var(--ink-rgb,20,20,20));--ink-muted:rgba(var(--ink-rgb,20,20,20),.5);width:var(--canvas);height:var(--canvas);position:relative;overflow:hidden;box-sizing:border-box;display:flex;background:var(--bg,#0b0b0c)}
.stage.show{padding:var(--sz-20)}/* bg mat around the frame, like the poster, only when traits are shown */
.frame{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg,#0b0b0c)}
.stage.show .frame{border:var(--bw) solid var(--ink)}
.art-box{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art-box svg{height:100%;width:auto;max-width:100%;display:block}
.band{flex:0 0 auto;box-sizing:border-box;height:var(--band-h);display:none;border-top:var(--bw) solid var(--ink)}
.stage.show .band{display:flex}
/* Corner marks (project name top-left, logo bottom-right) — live inside the poster frame, ride the "i" reveal with the band, and use the adaptive ink so they flip with the background. The logo sits in the right paper margin (sz-90 = the mat width); the title overlays the top-left at the same sz-20 inset. */
.poster-title,.watermark{position:absolute;display:none}
.stage.show .poster-title,.stage.show .watermark{display:block}
.poster-title{top:var(--sz-20);left:var(--sz-20);color:var(--ink);text-transform:uppercase;z-index:10}
.poster-title-label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.poster-title-value{font-size:var(--sz-30);line-height:1;color:var(--ink);white-space:nowrap}
.watermark{right:var(--sz-20);bottom:calc(var(--band-h) + var(--sz-20));width:var(--sz-90);height:var(--sz-30);z-index:3;pointer-events:none}
.watermark svg{display:block;width:100%;height:100%;fill:var(--ink-muted)}
/* SVG export — top-right, revealed with the "i" traits panel. Pill with ink border + down-arrow, inverts to the piece background on press. It's a real <a download> whose href is a fresh blob URL (rebuilt on pointerdown/focus): left-click downloads in a normal browser, and where that's blocked (e.g. the Aleatory sandbox) right-click > "Save Link As" still saves the file. */
.export-bar{position:absolute;top:var(--sz-20);right:var(--sz-20);display:none;gap:calc(var(--scale-unit)*10);align-items:center;z-index:10}
.stage.show .export-bar{display:flex}
.export-bar .button{display:flex;align-items:center;gap:var(--sz-02);padding:calc(var(--scale-unit)*5) calc(var(--scale-unit)*7) calc(var(--scale-unit)*5) calc(var(--scale-unit)*10);border:var(--bw) solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);text-decoration:none;font:inherit;font-size:var(--sz-15);text-transform:uppercase;letter-spacing:.08em;line-height:1;-webkit-user-select:none;user-select:none;cursor:pointer}
.export-bar .button .icon{width:calc(var(--scale-unit)*16);height:calc(var(--scale-unit)*16);fill:currentColor;display:block;flex-shrink:0}
.export-bar .button:active{background:var(--ink);color:var(--bg,#0b0b0c)}
.export-bar .button[aria-busy="true"]{cursor:progress}
.export-bar .button.gif-busy{animation:gpulse .9s ease-in-out infinite}

.swatch{flex:0 0 auto;box-sizing:border-box;width:calc(var(--band-h) - var(--bw));height:calc(var(--band-h) - var(--bw));padding:var(--sz-20);display:flex;align-items:flex-end;justify-content:center;border-right:var(--bw) solid var(--ink)}
.bars{display:flex;flex-direction:row;align-items:flex-end;width:100%;height:100%}
.cbar{flex:1 0 0;min-width:0}
.cbar.unused{aspect-ratio:1;height:auto}
.data{flex:1;display:flex;flex-direction:column;min-width:0}
.drow{display:flex;flex:1;min-width:0;min-height:0}
.drow.top{border-bottom:var(--bw) solid var(--ink)}
.cell{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--sz-02)*1.4);padding:var(--sz-20);border-right:var(--bw) solid var(--ink);min-width:0;min-height:0;overflow:hidden}
.cell:last-child{border-right:none}
.cell.fill{flex:1 0 auto}/* grows to fill, but never shrinks below its own content */
.cell.msg{flex:0 1 auto;min-width:0}/* snug to the message text; shrinks + ellipsizes once it meets the Pattern cell */
.cell.hug{flex:0 0 auto}
.label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.value{font-size:var(--sz-30);line-height:1;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.msgv{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;outline:none;cursor:text}
.msgv:empty:before{content:attr(data-ph);opacity:.4}
</style>

<script>
/* MKFLAT: rewrite a layered Makimono SVG as flat full frames, without the browser's animation clock.

   Distinct grids become complete, opaque frames (backing = the frame's most common edge colour, then every other pixel), one visible at a time,

    var T=o.transform!=null?tr("translate("+o.transform+")"):tr(n.getAttribute("transform"));tx+=T[0];ty+=T[1];
    var cp=n.getAttribute("clip-path");if(cp){var id=/#([^)]+)\)/.exec(cp),ce=id&&doc.getElementById(id[1]),cr=ce&&ce.querySelector("rect");
      if(cr)clips=clips.concat([[+cr.getAttribute("x")+tx,+cr.getAttribute("y")+ty,+cr.getAttribute("width"),+cr.getAttribute("height")]])}

(function () {
// Dev harness: only runs when opened outside the Aleatory sandbox. Reload for a
// new seed, pin one with ?seed=<hex>. On chain $alea is installed by the renderer,
// which also replaces Math.random with the seeded stream and freezes the clock.

  var q = query.get("seed");

    .map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");

  function xmur3(str) {
    var h = 1779033703 ^ str.length;
    for (var i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      h ^= h >>> 16;
      return h >>> 0;
    };

    pick: function (arr) { return arr[Math.floor(rand() * arr.length)]; },

<script>/* PLAYER: the seed field also takes
