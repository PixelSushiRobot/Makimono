<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Makimono — review grid</title>
<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0b0b0c;color:#e8e8ea;font:13px/1.4 ui-sans-serif,system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;background:#141416;border-bottom:1px solid #26262b;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
  .grp{display:flex;gap:6px;align-items:center}
  .grp label{color:#9a9aa2;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  select,input[type=number],button{background:#1d1d21;color:#e8e8ea;border:1px solid #34343b;border-radius:6px;padding:5px 8px;font:inherit}
  button{cursor:pointer}
  button.primary{background:#2b6cff;border-color:#2b6cff}
  .tally{margin-left:auto;color:#9a9aa2;font-variant-numeric:tabular-nums}
  main{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .card{background:#141416;border:1px solid #26262b;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .card.up{border-color:#2fae55}.card.down{border-color:#d8483f}
  .thumb{display:flex;justify-content:center;background:#0b0b0c;padding:8px}
  .thumb svg{width:156px;height:156px;display:block}
  .meta{padding:8px 10px;font-size:11px;color:#9a9aa2;border-top:1px solid #26262b;flex:1}
  .meta b{color:#e8e8ea;font-weight:600}
  .seed{padding:4px 10px;font-family:ui-monospace,monospace;font-size:10px;color:#6f6f78;cursor:pointer;word-break:break-all}
  .vote{display:flex;gap:6px;padding:8px 10px;border-top:1px solid #26262b}
  .vote button{flex:1;font-size:15px}
  .vote button.on.u{background:#2fae55;border-color:#2fae55}
  .vote button.on.d{background:#d8483f;border-color:#d8483f}
  .note{width:100%;box-sizing:border-box;border:0;border-top:1px solid #26262b;background:#101013;color:#e8e8ea;padding:7px 10px;font:inherit;resize:vertical;min-height:30px}
  dialog{background:#141416;color:#e8e8ea;border:1px solid #34343b;border-radius:10px;max-width:600px;width:92%}
  dialog h3{margin:.2em 0 .8em}
</style>
</head>
<body>

/* ===== Makimono review grid — LOCAL QA TOOL, not for mint ===== */
/* Renders N seeded pieces (optionally filtered to specific traits), each with a
   thumbs up/down toggle and a note. Votes persist in localStorage and export to
   JSON/CSV. Summary aggregates up/down votes per trait value to guide tuning. */

const FILTERS = ["pattern", "palette", "ramp", "speed", "roll", "nori", "rice", "shape", "direction"];
const LABELS = { pattern: "Pattern", palette: "Palette", ramp: "Color Ramp", speed: "Speed", roll: "Roll Type", nori: "Nori", rice: "Rice", shape: "Eye Shape", direction: "Direction" };
const OPTIONS = { pattern: PAT, palette: MIX, ramp: RAMP, speed: SPD, roll: ROLL, nori: NORI, rice: RICE, shape: SHAPE, direction: DIR };

/* --- trait forcing: same wp() wrapper the test build uses --- */
let FORCE = {};
const CANON = { pattern: PAT, palette: MIX, ramp: RAMP, speed: SPD, roll: ROLL, shape: SHAPE, direction: DIR, nori: NORI, rice: RICE };
const listKey = l => {
  const id = l.map(x => x[0]);
  if (id.includes("scroll_h") || id.includes("diagonal")) return "pattern";
  if (id.includes("classic") && id.includes("neon")) return "palette";
  if (id.includes("trio") && id.includes("mirror")) return "ramp";
  if (id.includes("normal") && id.includes("slow")) return "speed";
  if (id.includes("maki") && id.includes("uramaki")) return "roll";
  if (id.includes("original") && id.includes("tall")) return "shape";
  if (id.includes("reverse") && id.includes("forward")) return "direction";
  if (id.includes("black") && id.includes("charcoal")) return "nori";
  if (id.includes("white") && id.includes("cream")) return "rice";
  return null;
};
const _wp = wp;
wp = (R, l) => {
  const r = _wp(R, l), k = listKey(l);
  if (k && FORCE[k]) {
    const m = l.find(x => x[0] === FORCE[k]) || (CANON[k] && CANON[k].find(x => x[0] === FORCE[k]));
    if (m) return [m, wt(m) / sum(l)];
  }
  return r;
};

/* --- seeds + persistence --- */
const randSeed = () => Array.from(crypto.getRandomValues(new Uint8Array(16))).map(b => b.toString(16).padStart(2, "0")).join("");
const STORE = "mkmn_review_votes";
let VOTES = JSON.parse(localStorage.getItem(STORE) || "{}");
const save = () => { localStorage.setItem(STORE, JSON.stringify(VOTES)); tally(); };

/* --- header UI --- */
const mk = (tag, props, txt) => { const e = document.createElement(tag); if (props) Object.assign(e, props); if (txt != null) e.textContent = txt; return e; };
const header = mk("header");
const sels = {};
FILTERS.forEach(f => {
  const g = mk("div", { className: "grp" });
  g.appendChild(mk("label", null, LABELS[f]));
  const s = mk("select");
  s.appendChild(new Option("Auto", ""));
  OPTIONS[f].forEach(row => s.appendChild(new Option(dn(f, row[0]), row[0])));
  sels[f] = s; g.appendChild(s); header.appendChild(g);
});
const gc = mk("div", { className: "grp" });
gc.appendChild(mk("label", null, "Count"));
const countEl = mk("input", { type: "number", value: "24", min: "1", max: "120" });
countEl.style.width = "60px";
gc.appendChild(countEl); header.appendChild(gc);
const bNew = mk("button", { className: "primary" }, "New batch");
const bBg = mk("button", null, "Background: B (new)");
const bRM = mk("button", null, "Motion: Live");
const bPal = mk("button", null, "Palette: Generative");
const bJSON = mk("button", null, "Export JSON");
const bCSV = mk("button", null, "Export CSV");
const bSum = mk("button", null, "Summary");
const bClear = mk("button", null, "Clear votes");
[bNew, bBg, bRM, bPal, bJSON, bCSV, bSum, bClear].forEach(b => header.appendChild(b));
const tallyEl = mk("span", { className: "tally" });
header.appendChild(tallyEl);
document.body.appendChild(header);
const main = mk("main");
document.body.appendChild(main);

/* --- render a batch (seeds persist, so the Background toggle redraws the SAME pieces) --- */
const forceSig = () => FILTERS.map(f => FORCE[f] || "").join(",");
let batch = [];
function newBatch() {
  const n = Math.max(1, Math.min(120, +countEl.value || 24));
  batch = [];
  for (let i = 0; i < n; i++) batch.push(randSeed());
  draw();
}
function draw() {
  FORCE = {};
  FILTERS.forEach(f => { if (sels[f].value) FORCE[f] = sels[f].value; });
  const sig = forceSig();
  main.innerHTML = "";
  batch.forEach(seed => {
    let res;
    try { res = gen(seed); } catch (e) { return; }
    const key = seed + "|" + sig + "|" + BGMODE + "|" + PALMODE;
    const rec = VOTES[key] || (VOTES[key] = { seed, bgmode: BGMODE, force: { ...FORCE }, traits: res.tr, vote: 0, note: "" });
    rec.traits = res.tr;
    const card = mk("div", { className: "card" + (rec.vote > 0 ? " up" : rec.vote < 0 ? " down" : "") });
    const th = mk("div", { className: "thumb" }); th.innerHTML = res.svg; card.appendChild(th);
    const meta = mk("div", { className: "meta" });
    meta.innerHTML = Object.entries(res.tr).map(([k, v]) => k + ": <b>" + v + "</b>").join(" &middot; ");
    card.appendChild(meta);
    const seedEl = mk("div", { className: "seed", title: "click to copy seed" }, seed);
    seedEl.onclick = () => navigator.clipboard && navigator.clipboard.writeText(seed);
    card.appendChild(seedEl);
    const vote = mk("div", { className: "vote" });
    const up = mk("button", { className: "u" + (rec.vote > 0 ? " on" : "") }, "👍");
    const down = mk("button", { className: "d" + (rec.vote < 0 ? " on" : "") }, "👎");
    up.onclick = () => { rec.vote = rec.vote > 0 ? 0 : 1; card.className = "card" + (rec.vote > 0 ? " up" : ""); up.className = "u" + (rec.vote > 0 ? " on" : ""); down.className = "d"; save(); };
    down.onclick = () => { rec.vote = rec.vote < 0 ? 0 : -1; card.className = "card" + (rec.vote < 0 ? " down" : ""); down.className = "d" + (rec.vote < 0 ? " on" : ""); up.className = "u"; save(); };
    vote.appendChild(up); vote.appendChild(down); card.appendChild(vote);
    const note = mk("textarea", { className: "note", placeholder: "why? (optional)" });
    note.value = rec.note || "";
    note.oninput = () => { rec.note = note.value; save(); };
    card.appendChild(note);
    main.appendChild(card);
  });
  tally();
}
FILTERS.forEach(f => sels[f].onchange = draw);
countEl.onchange = newBatch;

function tally() {
  const v = Object.values(VOTES);
  const up = v.filter(x => x.vote > 0).length, down = v.filter(x => x.vote < 0).length, noted = v.filter(x => x.note).length;
  tallyEl.textContent = v.length + " seen · 👍 " + up + " · 👎 " + down + " · " + noted + " notes";
}

/* --- export + summary --- */
function download(name, data, type) {
  const b = new Blob([data], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}
bNew.onclick = newBatch;
bBg.onclick = () => { BGMODE = BGMODE === "b" ? "old" : "b"; bBg.textContent = "Background: " + (BGMODE === "b" ? "B (new)" : "current"); draw(); };
bRM.onclick = () => { RMODE = RMODE === "live" ? "baked" : "live"; bRM.textContent = "Motion: " + (RMODE === "live" ? "Live" : "Baked"); draw(); };
bPal.onclick = () => { PALMODE = PALMODE === "gen" ? "bombas" : "gen"; bPal.textContent = "Palette: " + (PALMODE === "gen" ? "Generative" : "Bombas"); draw(); };
bClear.onclick = () => { if (confirm("Clear all votes and notes?")) { VOTES = {}; save(); draw(); } };
bJSON.onclick = () => download("makimono-review.json", JSON.stringify(Object.values(VOTES), null, 2), "application/json");
bCSV.onclick = () => {
  const rows = Object.values(VOTES);
  if (!rows.length) return;
  const traitCols = Object.keys(rows[0].traits || {});
  const cols = ["seed", "vote", "note"].concat(traitCols);
  const esc = s => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
  const line = r => cols.map(c => esc(c === "seed" ? r.seed : c === "vote" ? r.vote : c === "note" ? r.note : (r.traits && r.traits[c]))).join(",");
  download("makimono-review.csv", [cols.join(",")].concat(rows.map(line)).join("\n"), "text/csv");
};
bSum.onclick = () => {
  const agg = {};
  Object.values(VOTES).forEach(r => {
    if (!r.traits || !r.vote) return;
    Object.entries(r.traits).forEach(([k, val]) => {
      (agg[k] = agg[k] || {});
      (agg[k][val] = agg[k][val] || { up: 0, down: 0 });
      if (r.vote > 0) agg[k][val].up++; else agg[k][val].down++;
    });
  });
  let html = "<h3>Votes by trait value (most 👎 first)</h3>";
  Object.keys(agg).forEach(k => {
    html += '<div style="margin:.6em 0"><b>' + k + "</b>";
    Object.entries(agg[k]).sort((a, b) => b[1].down - a[1].down).forEach(([val, c]) => {
      html += '<div style="display:flex;gap:10px;font-size:12px;margin:2px 0"><span style="width:130px;color:#9a9aa2">' + val + '</span><span style="color:#2fae55">▲' + c.up + '</span><span style="color:#d8483f">▼' + c.down + "</span></div>";
    });
    html += "</div>";
  });
  let d = document.getElementById("sumdlg");
  if (!d) { d = mk("dialog", { id: "sumdlg" }); document.body.appendChild(d); }
  d.innerHTML = html + '<div style="margin-top:1em;text-align:right"><button onclick="this.closest(\'dialog\').close()">Close</button></div>';
  d.showModal();
};

newBatch();
</script>
</body>
</html>
