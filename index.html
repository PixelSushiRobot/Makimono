const Q=cp!=="classic",[rm,p0]=wp(R,RAMP);let C=ramp(rm[0],R);
let[pt,pp]=wp(R,rm[0]==="duo"||rm[0]==="accent"?PAT.filter(x=>x[0]!=="chromie"&&(cp==="classic"||x[0]!=="filling_cycle")):PAT);const[di,pd]=wp(R,DIR);let[sp,ps]=wp(R,SPD);
let[tn,p1]=wp(R,TONE),[no,p2]=wp(R,Q?[["-","#000000",1]]:NORI),[ri,p3]=wp(R,Q?[["-","#ffffff",1]]:RICE);
const[sh,p5]=wp(R,SHAPE),[ro,p9]=wp(R,ROLL);
let QB=null;if(Q){QB=cp==="mono"?monoRoles(R):rcRoles(rm[0],R);no=[QB.noriN,QB.nori];ri=[QB.riceN,QB.rice];p1=1;p2=QB.pr;p3=1;C=QB.C;tn=[QB.tone,null]}

if((pt[0]==="chromie"||(pt[0]==="filling_cycle"&&cp!=="classic"))&&new Set(C).size<3)pt=PAT.find(x=>x[0]==="scroll_h");
if((["checker","sparkle"].includes(pt[0])||rm[0]==="duo"||rm[0]==="accent")&&sp[1]<210)sp=SPD[1];
if(isText(pt[0])&&sp[1]<130)sp=SPD[0];
let msg=MSGOF[pt[0]]||"";if(opt.text){pt=["text_custom"];msg=clean(opt.text)||"HI";pp=1}
if(ro[1]===0&&cp!=="mono"&&C.some(k=>contrast(k,ri[1])<1.3)&&C.every(k=>contrast(k,"#ffffff")>=1.3))ri=["white","#ffffff"];
const U=ro[1]===1,bgc=Q?{c:QB.bg,h:Math.round(hue(QB.bg)),neutral:false,name:tn[0]}:compBg(C,tn,no[1],R);
if(ri[0]==="cream"&&!bgc.neutral&&bgc.h>65&&bgc.h<310)ri=["white","#ffffff"];/* warm Cream rice clashes on cool-hued pieces; White always reads, so fall back to it there */
const bodyC=U?ri[1]:no[1],ringC=U?no[1]:ri[1];let bgCol=bgc.c;if(contrast(bgCol,bodyC)<2)bgCol=no[1];
const lite=Q?[bgc.c,ri[1]].sort((a,b)=>lum(b)-lum(a))[0]:"#ffffff";
let eyeC=ringC;/* eyes match the inner/contrasting roll color: maki -> rice (White/Cream eyes), uramaki -> nori (dark eyes). Separate Eyes trait removed. */
const inF=(x,y)=>FILL.some(c=>c[0]===x&&c[1]===y);
const S={},T=types();
for(let y=0;y<11;y++)for(let x=0;x<11;x++){const t=T[y][x];if(t==="r"&&!inF(x,y))S[x+","+y]=ringC}
const H=sh[1],top=10-H;
let body="";
if(RENDER[pt[0]]==="marquee"){let M={},steps,v=[];
if(isText(pt[0])){const L=adv(msg),uc=[...new Set(C)];steps=L+8;let cx=0;
msg.split("").forEach((ch,i)=>{if(ch!==" "){const g=FONT[ch];for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(g[r*3+c]==="1")M[(9+cx+c)+","+(2+r)]=uc[i%uc.length]}cx+=ch===" "?2:4});
for(let k=0;k<steps;k++)v.push("-"+k+" 0")}
else{const fq=pt[0]==="wave_2"?2:1;steps=12;let py=null;
for(let c=0;c<19;c++){const w=Math.sin(2*Math.PI*fq*c/12),y=3+(w>.4?1:w<-.4?-1:0),x=2+c;M[x+","+y]=C[c%6];if(py!==null&&Math.abs(y-py)>1)M[x+",3"]=C[c%6];py=y}
for(let k=0;k<steps;k++)v.push("-"+k+" 0")}
if(di[1]<0&&!isText(pt[0]))v=[v[0]].concat(v.slice(1).reverse());
/* No nested <svg>: its separate viewport rounds independently at fractional display scale and seams at the band edge. Instead the glyph layer scrolls unclipped and is masked back to the band window by opaque pixels that snap to the grid like the body. Draw order: nori band (under text) -> scrolling text -> ring garnish (cols 1/9 + corners) -> body edges (cols 0/10) -> background margins (roll cols -1/11, the 1px viewBox gutter). */
body='<path fill="'+no[1]+'" d="M3 2h5v3h-5zM2 3h1v1h-1zM8 3h1v1h-1z"/><g><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="'+v.join(";")+'" dur="'+steps*sp[1]+'ms" repeatCount="indefinite"/>'+paths(M)+'</g><path fill="'+ringC+'" d="M1 2h1v3h-1zM9 2h1v3h-1zM2 2h1v1h-1zM2 4h1v1h-1zM8 2h1v1h-1zM8 4h1v1h-1z"/><path fill="'+bodyC+'" d="M0 2h1v3h-1zM10 2h1v3h-1z"/><path fill="'+bgCol+'" d="M-1 2h1v3h-1zM11 2h1v3h-1z"/>';
}
else if(RENDER[pt[0]]==="maki"){const q=rng(seed+"mk"),u=[...new Set(C)],cyc=Array.from({length:6},(_,i)=>u[i%u.length]),SEM=cp==="classic"?[P.pink,P.red,P.orange,P.yellow,P.lime,P.green]:cyc,OC=cp==="classic"?[P.pink,P.green,P.lime,P.red,P.orange,P.yellow]:cyc;
const rk=(x,y)=>x===2||x===8?3:x===3||x===7?2:(x===5&&y===3)?0:1,orig={};for(const k in ORIGL)orig[k]=OC[ORIGL[k]];
const ix=[0,1,2,3,4,5,6,7];for(let i=7;i>0;i--){const j=Math.floor(q()*(i+1));[ix[i],ix[j]]=[ix[j],ix[i]]}const ord=ix.slice(0,3);
const tm=n=>{const e=SEM[MAKI[n][1]],d=SEM[MAKI[n][3]];let kk=MAKI[n][2],k=SEM[kk],g=0;while(k===e&&g<6){kk++;g++;k=SEM[kk%6]}const m={};FILL.forEach(([x,y])=>{const r=rk(x,y);m[x+","+y]=r===0?d:r===1?k:e});return m};
const mix=(a,b,t)=>{const m={};FILL.forEach(([x,y])=>{const k=x+","+y;m[k]=rk(x,y)<=t?b[k]:a[k]});return m};
const seq=[];let cur=orig;for(let i=0;i<3;i++)seq.push(cur);
ord.forEach(n=>{const nx=tm(n);for(let t=0;t<3;t++)seq.push(mix(cur,nx,t));seq.push(nx,nx);cur=nx});for(let t=0;t<3;t++)seq.push(mix(cur,orig,t));
const N=seq.length,st=sp[1],Tt=N*st;
seq.forEach((m,f)=>{body+='<g visibility="'+(f?"hidden":"visible")+'"><animate attributeName="visibility" calcMode="discrete" values="visible;hidden;hidden" keyTimes="0;'+(1/N).toFixed(4)+';1" begin="'+f*st+'ms" dur="'+Tt+'ms" repeatCount="indefinite"/>'+paths(m)+'</g>'});
}
else{const kt=Array.from({length:FR+1},(_,i)=>(i/FR).toFixed(4)).join(";"),fl=RENDER[pt[0]]==="flow";let SHP=[];
if(fl){const q=rng(seed+"flow"),tf=[0,1,2,3,4,5,6].map(c=>c>0&&c<6&&q()<.5);if(tf.filter(Boolean).length<2){tf[2]=true;tf[4]=true}let py=null;
for(let c=0;c<7;c++){const w=Math.sin(2*Math.PI*c/6),y=3+(w>.4?1:w<-.4?-1:0),cells=[y];if(py!==null&&Math.abs(y-py)>1)cells.push(3);
if(tf[c]){const e=y===4?3:y===2?3:(q()<.5?2:4);if(!cells.includes(e))cells.push(e)}SHP.push(cells);py=y}}
for(let f=0;f<FR;f++){const M={};
if(fl){FILL.forEach(([x,y])=>M[x+","+y]=no[1]);SHP.forEach((cells,c)=>{const k=C[((c+di[1]*f)%6+6)%6];cells.forEach(y=>M[(2+c)+","+y]=k)})}
else if(pt[0]==="checker"){const i=(f>>1)%6;let j=(i+3)%6,k=0;while(C[j]===C[i]&&k<6){j=(j+1)%6;k++}FILL.forEach(([x,y])=>{M[x+","+y]=((x+y+f)&1)?C[j]:C[i]})}
else FILL.forEach(([x,y])=>{M[x+","+y]=C[((idx(pt[0],x,y,f,di[1])%6)+6)%6]});
if(!fl){const vs=FILL.map(c=>M[c[0]+","+c[1]]);if(new Set(vs).size<2){const o=C.find(k=>k!==vs[0]);if(o)FILL.forEach(([x,y])=>{if((x+y)&1)M[x+","+y]=o})}}
if(pt[0]==="sparkle"){const r2=rng(seed+"s"+f);for(let k=0;k<3;k++){const c=FILL[Math.floor(r2()*FILL.length)];M[c[0]+","+c[1]]=lite}}
const vals=Array.from({length:FR+1},(_,i)=>i%FR===f?"visible":"hidden").join(";");
body+='<g visibility="'+(f?"hidden":"visible")+'"><animate attributeName="visibility" calcMode="discrete" values="'+vals+'" keyTimes="'+kt+'" dur="'+FR*sp[1]+'ms" repeatCount="indefinite"/>'+paths(M)+'</g>'}}
const HT=HOP.s+HOP.up+HOP.t+HOP.down,hs=["T","M","S","M","T"],hk=[0,HOP.t,HOP.t+HOP.down,HOP.t+HOP.down+HOP.s,HT].map(v=>(v/HT).toFixed(4)).join(";"),hv=f=>hs.map(f).join(";"),an=(a,f)=>'<animate attributeName="'+a+'" calcMode="discrete" values="'+hv(f)+'" keyTimes="'+hk+'" dur="'+HT+'ms" repeatCount="indefinite"/>';
let eyes='';[2,6].forEach(x=>{eyes+='<rect x="'+x+'" y="'+top+'" width="1" height="'+H+'" fill="'+eyeC+'">'+an("y",c=>c==="S"?top+1:top)+'</rect>'});
const Sup={},Slo={};for(const k in S){(+k.split(",")[1]<=5?Sup:Slo)[k]=S[k]}
const topG='<g><animateTransform attributeName="transform" type="translate" calcMode="discrete" values="'+hv(c=>"0 "+({S:2,M:1,T:0})[c])+'" keyTimes="'+hk+'" dur="'+HT+'ms" repeatCount="indefinite"/><path fill="'+bodyC+'" d="M3 0h5v1h-5zM1 1h9v1h-9zM0 2h11v4h-11z"/>'+paths(Sup)+body+'</g>';
const ovl=[0,9].map(x=>'<rect x="'+x+'" y="9" width="2" height="2" fill="'+bodyC+'" visibility="hidden">'+an("visibility",c=>c==="S"?"visible":"hidden")+'</rect>').join('');
const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 13" width="520" height="520" shape-rendering="crispEdges"><rect width="13" height="13" fill="'+bgCol+'"/><g transform="translate(1,2)"><path fill="'+bodyC+'" d="M0 5h11v5h-11zM1 10h9v1h-9z"/>'+paths(Slo)+ovl+topG+eyes+'</g></svg>';
const odds=opt.text?0:1/(pmix*p0*pp*(isText(pt[0])?1:pd)*ps*p1*p2*p3*p5*p9);
const tr={"Pattern":dn('pattern',pt[0]),"Direction":isText(pt[0])?"Reverse":dn('direction',di[0]),"Color Ramp":dn('ramp',rm[0]),"Speed":dn('speed',sp[0]),"Palette":dn('palette',cp),"Nori":noriLabel(no[0]),"Rice":riceLabel(ri[0]),"Eye Shape":dn('shape',sh[0]),"Roll Type":dn('roll',ro[0])};
return{svg,mode:pt[0],odds,tr}}

/* ---- Aleatory driver: random-only. Seed comes from the mint operation hash. ---- */
/* The generator's own rng(seed) is seeded from $alea.seed, so every piece is a
   pure function of that hash. No collector parameters are declared. The still the
   renderer captures is this animation at t=0 (body at rest, frame 0): SMIL runs on
   the SVG timeline, so freezing Date/performance.now does not advance it; ready()
   fires synchronously below, so the cover is deterministic. */
var res = gen(alea.seed);
document.body.insertAdjacentHTML("beforeend", res.svg);
/* Name only the Type pieces, by the message alone. For a text pattern, collapse
   Pattern to the generic "Type" and add a Message feature carrying the word, so the
   trait list reads Pattern: Type / Message: ANTS (no duplication) and the title
   becomes "Makimono #N — ANTS". Every other pattern keeps its own Pattern value and
   has no Message key at all (one fewer trait, never an empty one). Studio name field: Message. */
var feats = res.tr, msg = MSGOF[res.mode];
if (msg) feats = Object.assign({}, res.tr, { Pattern: "Type", Message: msg });
alea.features(feats);
alea.ready();
})();
</script>
