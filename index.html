.stage.show{padding:var(--sz-20)}/* bg mat around the frame, like the poster, only when traits are shown */
.frame{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg,#0b0b0c)}
.stage.show .frame{border:var(--bw) solid var(--ink)}
.art-box{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art-box svg{height:100%;width:auto;max-width:100%;display:block}
.band{flex:0 0 auto;box-sizing:border-box;height:var(--band-h);display:none;border-top:var(--bw) solid var(--ink)}
.stage.show .band{display:flex}
/* Corner marks (project name top-left, logo bottom-right) — live inside the poster frame, ride the "i" reveal with the band, and use the adaptive ink so they flip with the background. The logo sits in the right paper margin (sz-90 = the mat width); the title overlays the top-left at the same sz-20 inset. */
.poster-title,.watermark{position:absolute;display:none}
.stage.show .poster-title,.stage.show .watermark{display:block}
.poster-title{top:var(--sz-20);left:var(--sz-20);color:var(--ink);text-transform:uppercase;z-index:10}
.poster-title-label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.poster-title-value{font-size:var(--sz-30);line-height:1;color:var(--ink);white-space:nowrap}
.watermark{right:var(--sz-20);bottom:calc(var(--band-h) + var(--sz-20));width:var(--sz-90);height:var(--sz-30);z-index:3;pointer-events:none}
.watermark svg{display:block;width:100%;height:100%;fill:var(--ink-muted)}
/* SVG export — top-right, revealed with the "i" traits panel. Pill with ink border + down-arrow, inverts to the piece background on press. It's a real <a download> whose href is a fresh blob URL (rebuilt on pointerdown/focus): left-click downloads in a normal browser, and where that's blocked (e.g. the Aleatory sandbox) right-click > "Save Link As" still saves the file. */
.export-bar{position:absolute;top:var(--sz-20);right:var(--sz-20);display:none;gap:calc(var(--scale-unit)*10);align-items:center;z-index:10}
.stage.show .export-bar{display:flex}
.export-bar .button{display:flex;align-items:center;gap:var(--sz-02);padding:calc(var(--scale-unit)*5) calc(var(--scale-unit)*7) calc(var(--scale-unit)*5) calc(var(--scale-unit)*10);border:var(--bw) solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);text-decoration:none;font:inherit;font-size:var(--sz-15);text-transform:uppercase;letter-spacing:.08em;line-height:1;-webkit-user-select:none;user-select:none;cursor:pointer}
.export-bar .button .icon{width:calc(var(--scale-unit)*16);height:calc(var(--scale-unit)*16);fill:currentColor;display:block;flex-shrink:0}
.export-bar .button:active{background:var(--ink);color:var(--bg,#0b0b0c)}
.export-bar .button[aria-busy="true"]{cursor:progress}
.export-bar .button.gif-busy{animation:gpulse .9s ease-in-out infinite}
@keyframes gpulse{50%{border-color:var(--ink-muted)}}
.swatch{flex:0 0 auto;box-sizing:border-box;width:calc(var(--band-h) - var(--bw));height:calc(var(--band-h) - var(--bw));padding:var(--sz-20);display:flex;align-items:flex-end;justify-content:center;border-right:var(--bw) solid var(--ink)}
.bars{display:flex;flex-direction:row;align-items:flex-end;width:100%;height:100%}
.cbar{flex:1 0 0;min-width:0}
.cbar.unused{aspect-ratio:1;height:auto}
.data{flex:1;display:flex;flex-direction:column;min-width:0}
.drow{display:flex;flex:1;min-width:0;min-height:0}
.drow.top{border-bottom:var(--bw) solid var(--ink)}
.cell{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--sz-02)*1.4);padding:var(--sz-20);border-right:var(--bw) solid var(--ink);min-width:0;min-height:0;overflow:hidden}
.cell:last-child{border-right:none}
.cell.fill{flex:1 0 auto}/* grows to fill, but never shrinks below its own content */
.cell.msg{flex:0 1 auto;min-width:0}/* snug to the message text; shrinks + ellipsizes once it meets the Pattern cell */
.cell.hug{flex:0 0 auto}
.label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.value{font-size:var(--sz-30);line-height:1;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.msgv{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;outline:none;cursor:text}
.msgv:empty:before{content:attr(data-ph);opacity:.4}
</style>

function cellHTML(l,v,fill){return '<div class="cell '+(fill?"fill":"hug")+'"><span class="label">'+l+'</span><span class="value">'+esc(v)+'</span></div>'}

  return pal.map(function(c,i){var u=usage[i];if(u<=0)return '<div class="cbar unused" style="background:'+c+'"></div>';var h=Math.max(u/maxU,minR)*100;return '<div class="cbar" style="background:'+c+';height:'+h.toFixed(2)+'%"></div>'}).join("")}
function msgCellHTML(v){return '<div class="cell msg"><span class="label">Message</span><span class="value msgv" contenteditable="true" spellcheck="false" data-ph="ADD…">'+esc(v)+'</span></div>'}
function botHTML(tr){/* Profile cell only when the trait exists (Classic Maki has none: the ramp has no effect there) */return cellHTML("Palette",tr.Palette,true)+(tr["Profile"]!=null?cellHTML("Profile",tr["Profile"],false):"")+cellHTML("Form",tr["Form"],false)+cellHTML("Eyes",tr["Eye Shape"],false)}

  var top=cellHTML("Pattern",isType?"Text":tr.Pattern,true)+msgCellHTML(msg)+cellHTML("Direction",tr.Direction,false)+cellHTML("Speed",tr.Speed,false);
  var bot=botHTML(tr);
  return '<div class="swatch"><div class="bars">'+barsHTML(res.pal,res.usage)+'</div></div><div class="data"><div class="drow top">'+top+'</div><div class="drow bot">'+bot+'</div></div>';
}
/* The Message cell is the custom-message input. Typing partial-updates the art, usage
   bars, and the Pattern/Direction values in place, leaving the editable field (and its
   focus/caret) untouched. basePreset = the seed's own preset word (empty unless the
   seed is itself a Type piece). */
function wireMessage(basePreset){
  var msgv=band.querySelector(".msgv");if(!msgv)return;
  var bars=band.querySelector(".bars"),cells=band.querySelectorAll(".drow.top .cell"),patV=cells[0].querySelector(".value"),dirV=cells[2].querySelector(".value");
  function applyMsg(){
    var v=msgv.textContent.replace(/\s+/g," ").trim();
    if(!v&&msgv.innerHTML!=="")msgv.innerHTML="";/* drop the stray <br> contenteditable leaves behind, so :empty (the ADD… placeholder) matches again */
    var res=gen(alea.seed,v?{text:v}:undefined),isType=/^text_/.test(res.mode);
    feats=v?Object.assign({},res.tr,{Pattern:"Text",Message:v}):res.tr;
    curSvg=res.svg;artBox.innerHTML=curSvg;if(!hopOn)applyHop();bars.innerHTML=barsHTML(res.pal,res.usage);
    patV.textContent=isType?"Text":res.tr.Pattern;dirV.textContent=res.tr.Direction;band.querySelector(".drow.bot").innerHTML=botHTML(res.tr);/* a custom message turns Classic Maki into Type, where the ramp matters again */
  }

  msgv.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();msgv.blur()}});
  msgv.addEventListener("blur",function(){
    /* emptied -> ADD… placeholder, unless the seed is a Type piece, then restore its word */
    if(!msgv.textContent.trim()&&basePreset){msgv.textContent=basePreset;applyMsg()}
    msgv.scrollLeft=0;/* show a long/truncated message from the start, not the caret end */

}
/* Hop toggle: the three .hop SMIL animations (upper-half translate, eye y, squash overlays)
   stop/restart via endElement/beginElement. Stopped, each reverts to its resting base value =
   the standard pose; the fill/scroll animations are untagged and keep running. */
function applyHop(){var svg=artBox&&artBox.querySelector("svg");if(!svg)return;var l=svg.querySelectorAll(".hop");for(var i=0;i<l.length;i++){try{hopOn?l[i].beginElement():l[i].endElement()}catch(e){}}}
/* Build a standalone .svg of the live artwork and point the Save link at it as a blob: URL. Clone, stamp
   width/height so it opens at a real size (viewBox stays 0 0 13 13 — the unit grid), guarantee xmlns,
   serialize. Rebuilt on each pointerdown/focus so the href is current (e.g. after a message edit); the
   previous object URL is revoked, the new one stays alive through the save. Left-click downloads in a
   normal browser; in a locked-down sandbox (Aleatory) where auto-download and popups are blocked, the blob
   still saves via right-click > "Save Link As" (desktop) or tap & hold (mobile) — a user-initiated chrome
   action resolves the in-memory blob regardless of the frame's opaque origin. The art stays animated. */
var _expUrl=null;

  var svg=artBox&&artBox.querySelector("svg");if(!svg)return;
  var clone=svg.cloneNode(true),px=520;
  clone.setAttribute("width",px);clone.setAttribute("height",px);
  if(!clone.getAttribute("xmlns"))clone.setAttribute("xmlns","http://www.w3.org/2000/svg");

/* ---- GIF export: render the live animation to an animated GIF in-browser. Every SMIL
   animation is calcMode="discrete" on the 70ms grid, so each frame is one exact state; we
   bake slot k from the animations' own values/keyTimes/dur, rasterize at 1040px, and encode
   with a self-contained GIF89a writer (lossless exact palette, 7cs/70ms delays, loop forever). ---- */

function gBake(src,t){var clone=src.cloneNode(true);clone.querySelectorAll("animate,animateTransform").forEach(function(node){var parent=node.parentNode;var vals=(node.getAttribute("values")||"").split(";");var ktA=node.getAttribute("keyTimes");var kts=ktA?ktA.split(";").map(Number):vals.map(function(_,i){return vals.length>1?i/(vals.length-1):0});var dM=/(\d+(?:\.\d+)?)ms/.exec(node.getAttribute("dur")||""),dur=dM?parseFloat(dM[1]):0;var bM=/(\d+(?:\.\d+)?)ms/.exec(node.getAttribute("begin")||""),begin=bM?parseFloat(bM[1]):0;var apply=true,val=vals[0];if(dur>0){var local=t-begin;if(local<0){apply=false}else{local=local%dur;var frac=local/dur,bi=0;for(var j=0;j<kts.length;j++){if(kts[j]<=frac+1e-9)bi=j;else break}val=vals[Math.min(bi,vals.length-1)]}}if(apply&&parent){if(node.tagName.toLowerCase()==="animatetransform"){var type=node.getAttribute("type")||"translate";parent.setAttribute("transform",type+"("+val.trim().replace(/\s+/g,",")+")")}else{parent.setAttribute(node.getAttribute("attributeName"),val)}}node.parentNode&&node.parentNode.removeChild(node)});return clone}
function gRaster(clone){clone.setAttribute("width",GPX);clone.setAttribute("height",GPX);if(!clone.getAttribute("xmlns"))clone.setAttribute("xmlns","http://www.w3.org/2000/svg");var str=new XMLSerializer().serializeToString(clone);var url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(str);return new Promise(function(res,rej){var img=new Image();img.width=GPX;img.height=GPX;img.onload=function(){var fin=function(){var c=document.createElement("canvas");c.width=GPX;c.height=GPX;var ctx=c.getContext("2d");ctx.imageSmoothingEnabled=false;try{ctx.drawImage(img,0,0,GPX,GPX)}catch(e){return rej(new Error("drawImage: "+e.message))}var d;try{d=ctx.getImageData(0,0,GPX,GPX).data}catch(e){return rej(new Error("getImageData: "+e.message))}var op=false;for(var i=3;i<d.length;i+=4){if(d[i]!==0){op=true;break}}if(!op)return rej(new Error("raster blank"));res(d)};if(img.decode)img.decode().then(fin,function(){fin()});else fin()};img.onerror=function(){rej(new Error("svg image load error"))};img.src=url})}

/* ---- Keys: no visible button. "i" toggles the traits band (.show on the
   stage); the band is hidden from load so it never shows in the static capture. The
   Message cell inside the band is the custom-message input. No network,
   no effect on determinism. ---- */
(function(){
  window.addEventListener("keydown",function(e){
    if(e.target&&(e.target.isContentEditable||/^(INPUT|TEXTAREA)$/.test(e.target.tagName)))return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==="i"||e.key==="I"){e.preventDefault();if(stage)stage.classList.toggle("show")}
    else if(e.key==="m"||e.key==="M"){e.preventDefault();hopOn=!hopOn;if(hopOn){if(artBox)artBox.innerHTML=curSvg}else applyHop()}/* hop off: rest pose, fills keep running. hop on: re-inject the svg so hop and fills restart together from t=0 */
    else if(e.key==="Escape"&&stage)stage.classList.remove("show");

  /* Touch has no "i" key, so a tap on the artwork toggles the band (same as "i"). Taps inside the open band (incl. the Message input) and on the Save pill keep their own behavior. The band is hidden on load so it stays out of Aleatory's static capture. */
  window.addEventListener("click",function(e){
    if(!stage)return;
    var t=e.target;

    if(t&&t.closest&&t.closest(".band, .export-bar"))return;

  });
})();
})();
