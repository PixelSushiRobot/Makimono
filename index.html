/* The piece lives in a square stage. Normally the art fills it; adding .show (via the "i" key) shrinks the art up and reveals the traits band below, everything inside the square. All sizing derives from --canvas (the square side) so it scales with the viewport. Ink = the piece's nori color. */
.stage{--canvas:100vmin;--scale-unit:calc(var(--canvas)*0.001);--sz-02:calc(var(--scale-unit)*2);--sz-15:calc(var(--scale-unit)*15);--sz-20:calc(var(--scale-unit)*20);--sz-30:calc(var(--scale-unit)*30);--sz-90:calc(var(--scale-unit)*90);--bw:max(1px,var(--sz-02));--band-h:calc(var(--scale-unit)*180);--ink:rgb(var(--ink-rgb,20,20,20));--ink-muted:rgba(var(--ink-rgb,20,20,20),.5);width:var(--canvas);height:var(--canvas);position:relative;overflow:hidden;box-sizing:border-box;display:flex;background:var(--bg,#0b0b0c)}
.stage.show{padding:var(--sz-20)}/* bg mat around the frame, like the poster, only when traits are shown */
.frame{position:relative;flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg,#0b0b0c)}
.stage.show .frame{border:var(--bw) solid var(--ink)}
.art-box{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art-box svg{height:100%;width:auto;max-width:100%;display:block}
.band{flex:0 0 auto;box-sizing:border-box;height:var(--band-h);display:none;border-top:var(--bw) solid var(--ink)}
.stage.show .band{display:flex}
/* Corner marks (project name top-left, logo bottom-right) — live inside the poster frame, ride the "i" reveal with the band, and use the adaptive ink so they flip with the background. The logo sits in the right paper margin (sz-90 = the mat width); the title overlays the top-left at the same sz-20 inset. */
.poster-title,.watermark{position:absolute;display:none}
.stage.show .poster-title,.stage.show .watermark{display:block}
.poster-title{top:var(--sz-20);left:var(--sz-20);color:var(--ink);text-transform:uppercase;z-index:10}
.poster-title-label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.poster-title-value{font-size:var(--sz-30);line-height:1;color:var(--ink);white-space:nowrap}
.watermark{right:var(--sz-20);bottom:calc(var(--band-h) + var(--sz-20));width:var(--sz-90);height:var(--sz-30);z-index:3;pointer-events:none}
.watermark svg{display:block;width:100%;height:100%;fill:var(--ink-muted)}
/* SVG export — top-right, revealed with the "i" traits panel. Pill with ink border + down-arrow, inverts to the piece background on press. It's a real <a download> whose href is a fresh blob URL (rebuilt on pointerdown/focus): left-click downloads in a normal browser, and where that's blocked (e.g. the Aleatory sandbox) right-click > "Save Link As" still saves the file. */
.export-bar{position:absolute;top:var(--sz-20);right:var(--sz-20);display:none;gap:calc(var(--scale-unit)*10);align-items:center;z-index:10}
.stage.show .export-bar{display:flex}
.export-bar .button{display:flex;align-items:center;gap:var(--sz-02);padding:calc(var(--scale-unit)*5) calc(var(--scale-unit)*7) calc(var(--scale-unit)*5) calc(var(--scale-unit)*10);border:var(--bw) solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);text-decoration:none;font:inherit;font-size:var(--sz-15);text-transform:uppercase;letter-spacing:.08em;line-height:1;-webkit-user-select:none;user-select:none;cursor:pointer}
.export-bar .button .icon{width:calc(var(--scale-unit)*16);height:calc(var(--scale-unit)*16);fill:currentColor;display:block;flex-shrink:0}
.export-bar .button:active{background:var(--ink);color:var(--bg,#0b0b0c)}
.export-bar .button[aria-busy="true"]{cursor:progress}
.export-bar .button.gif-busy{animation:gpulse .9s ease-in-out infinite}
@keyframes gpulse{50%{border-color:var(--ink-muted)}}
.swatch{flex:0 0 auto;box-sizing:border-box;width:calc(var(--band-h) - var(--bw));height:calc(var(--band-h) - var(--bw));padding:var(--sz-20);display:flex;align-items:flex-end;justify-content:center;border-right:var(--bw) solid var(--ink)}
.bars{display:flex;flex-direction:row;align-items:flex-end;width:100%;height:100%}
.cbar{flex:1 0 0;min-width:0}
.cbar.unused{aspect-ratio:1;height:auto}
.data{flex:1;display:flex;flex-direction:column;min-width:0}
.drow{display:flex;flex:1;min-width:0;min-height:0}
.drow.top{border-bottom:var(--bw) solid var(--ink)}
.cell{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--sz-02)*1.4);padding:var(--sz-20);border-right:var(--bw) solid var(--ink);min-width:0;min-height:0;overflow:hidden}
.cell:last-child{border-right:none}
.cell.fill{flex:1 0 auto}/* grows to fill, but never shrinks below its own content */
.cell.msg{flex:0 1 auto;min-width:0}/* snug to the message text; shrinks + ellipsizes once it meets the Pattern cell */
.cell.hug{flex:0 0 auto}
.label{font-size:var(--sz-15);line-height:1.2;letter-spacing:.08em;text-transform:uppercase;color:rgba(var(--ink-rgb,20,20,20),.9);white-space:nowrap}
.value{font-size:var(--sz-30);line-height:1;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.msgv{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;outline:none;cursor:text}
.msgv:empty:before{content:attr(data-ph);opacity:.4}
</style>

#game .hint{position:absolute;left:50%;top:calc(100% - 50px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);font-size:11px;line-height:1.5;opacity:.6;text-align:center;text-wrap:balance} /* anchored just under the bar and grows downward, so a wrap never climbs into the bar */
#game .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(5,6,10,.74);text-align:center;color:#fff;pointer-events:auto;padding:24px}
#game .overlay h2{margin:0;font-size:26px;font-weight:700;letter-spacing:.03em}
#game .overlay p{margin:0;opacity:.82;font-size:13px;line-height:1.5;max-width:380px;text-wrap:pretty}
#game .overlay button{margin-top:10px;padding:11px 22px;border:1.5px solid #fff;background:transparent;color:#fff;border-radius:999px;font:600 13px ui-monospace,monospace;cursor:pointer;text-transform:uppercase;letter-spacing:.1em;display:inline-flex;align-items:center;gap:10px}
#game .overlay button kbd{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-width:18px;height:18px;padding:0 5px;margin-right:-8px;border:1px solid currentColor;border-radius:5px;font:700 10px ui-monospace,monospace;letter-spacing:0;opacity:.7} /* keyboard shortcut badge, right of the label */
#game .overlay button:active{background:#fff;color:#05060a}
#game .overlay .grade{font:800 15px ui-monospace,monospace;letter-spacing:.24em;margin:0}
#game .overlay .medal{line-height:0;margin:0}
#game .overlay .medal:empty,#game .overlay .grade:empty{display:none}
#game .overlay p.wel{margin:0 0 -2px;font:700 12px ui-monospace,monospace;letter-spacing:.32em;text-transform:uppercase;opacity:.8}
#game .overlay .logo{width:min(400px,76vw,80vh);aspect-ratio:2/1;margin:0;line-height:0;pointer-events:none} /* one 3D view: the KATAMAKI cube letters with the player's roll under them */
#game .overlay .logo canvas{display:block;width:100%!important;height:100%!important}
#game .overlay .logo .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#game .hidden{display:none}
#game .tpad{display:none}
#game.touch{touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game.touch .tpad{display:block;position:absolute;inset:0;touch-action:none}
#game .stick{position:absolute;left:calc(26px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,255,255,.07);pointer-events:none;opacity:.5;transition:opacity .15s}
#game .stick.on{bottom:auto;margin:-60px 0 0 -60px;opacity:1;transition:none}
#game .stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 2px 8px rgba(0,0,0,.35)}
#game .tpad button{display:grid;place-items:center;padding:0;color:#fff;touch-action:none;-webkit-tap-highlight-color:transparent}
#game .tpad button svg{display:block;fill:currentColor}
#game .hopb{position:absolute;right:calc(26px + env(safe-area-inset-right));bottom:calc(46px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12)}
#game .hopb svg{width:38px;height:38px}
#game .hopb.on{background:#fff;color:#05060a}
/* pause + back-to-art: small round icon buttons tucked under the timer, top-right */
#game .tbtns{position:absolute;top:calc(48px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:flex;gap:8px}
#game .tbtns button{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);background:rgba(5,6,10,.3)}
#game .tbtns button svg{width:16px;height:16px}
#game .tbtns button:active{background:rgba(255,255,255,.25)}
#game.touch .exit,#game.touch .overlay button kbd{display:none}
#game.touch .traits{top:calc(14px + env(safe-area-inset-top));left:calc(16px + env(safe-area-inset-left))}
#game.touch .timer{top:calc(14px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right))}
/* size bar, label and hint stay at the bottom like desktop, lifted clear of the home bar */
#game.touch .sizebar{bottom:calc(60px + env(safe-area-inset-bottom))}
#game.touch .sizelab{bottom:calc(76px + env(safe-area-inset-bottom))}
#game.touch .hint{top:calc(100% - 50px - env(safe-area-inset-bottom))}
/* landscape: the bar sits between the stick and HOP, so keep it out of their way */
@media (orientation:landscape){#game.touch .sizebar{width:min(calc(100vw - 380px),380px)}#game.touch .hint{max-width:calc(100vw - 360px)}}
/* portrait: the controls move up above the bar and its label */
@media (orientation:portrait){#game .stick{bottom:calc(112px + env(safe-area-inset-bottom))}#game .hopb{bottom:calc(130px + env(safe-area-inset-bottom))}}

  var X='<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3.939 3.161L12.839 12.061A.55 .55 0 0 1 12.061 12.839L3.161 3.939A.55 .55 0 0 1 3.939 3.161ZM12.839 3.939L3.939 12.839A.55 .55 0 0 1 3.161 12.061L12.061 3.161A.55 .55 0 0 1 12.839 3.939Z"/></svg>'; /* icons share one optical size: art about 73% of the 16-unit box (like the globe and arrow), lines about 1.1 thick */
  var p=document.createElement("div");p.className="button seedb";
  p.innerHTML='<span class="st" role="button" tabindex="0" aria-label="Show or enter a seed">SEED</span><span class="rr" role="button" tabindex="0" aria-label="New random seed">'+RR+'</span>'+
    '<input type="text" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="go" aria-label="Seed" placeholder="Paste a seed">'+
    (navigator.clipboard&&navigator.clipboard.readText?'<span class="sp" role="button" tabindex="0" aria-label="Paste seed from clipboard">PASTE</span>':'')+
    '<span class="sx" role="button" tabindex="0" aria-label="Close">'+X+'</span>';
  b.appendChild(p);
  try{history.replaceState({seed:$alea.seed},"")}catch(_){} // remember the first seed too, so Back can return to it
  window.addEventListener("popstate",function(e){var s=(e.state&&e.state.seed)||new URLSearchParams(location.search).get("seed");if(s&&s!==$alea.seed&&window.MKMN_RESEED){window.MKMN_RESEED(s);close()}}); // Back / Forward step through the seeds you've viewed
  var inp=p.querySelector("input");
  function load(v){v=(v||"").trim();if(!v)return;if(v===$alea.seed){close();return}
    if(window.MKMN_RESEED&&history.pushState){history.pushState({seed:v},"","?seed="+encodeURIComponent(v));window.MKMN_RESEED(v);close();return} // swap in place: no reload, the band stays open
    try{sessionStorage.setItem("mkmn-show","1")}catch(_){}location.search="?seed="+encodeURIComponent(v)} // fallback: reload with the seed
  function roll(){var a=new Uint8Array(32);crypto.getRandomValues(a);load(Array.from(a).map(function(x){return x.toString(16).padStart(2,"0")}).join(""))} // same format as a fresh page load
  function open(){b.classList.add("seeding");inp.value=$alea.seed;inp.focus();inp.select()}
  function close(){b.classList.remove("seeding");inp.blur()}
  function on(sel,fn){var el=p.querySelector(sel);if(!el)return;el.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();fn()});
    el.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();fn()}})}
  on(".st",open);on(".rr",roll);on(".sx",close);
  // press state for the SEED part only. Like the other buttons it holds while the pointer is down, even if it slides off;
  // releasing anywhere clears it, and the field only opens if the release lands back on SEED (a normal click)
  var stEl2=p.querySelector(".st");stEl2.addEventListener("pointerdown",function(){p.classList.add("press")});
  ["pointerup","pointercancel"].forEach(function(n){window.addEventListener(n,function(){p.classList.remove("press")})});
  // a press that starts on the pill and is released elsewhere makes the browser send a click to the shared parent (the art),
  // which would toggle the band. The other buttons are links, so a drag never clicks them. Swallow that stray click.
  var downIn=false;window.addEventListener("pointerdown",function(e){downIn=p.contains(e.target)},true);
  window.addEventListener("click",function(e){if(downIn&&!p.contains(e.target)){e.stopImmediatePropagation();e.preventDefault()}downIn=false},true);
  on(".sp",function(){navigator.clipboard.readText().then(function(t){t=(t||"").trim();if(t){inp.value=t;load(t)}else inp.focus()},function(){inp.focus()})}); // if the browser refuses, fall back to pasting into the field
  p.querySelector(".sp")&&p.querySelector(".sp").addEventListener("mousedown",function(e){e.preventDefault()}); // keep focus in the field
  inp.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();load(inp.value)}else if(e.key==="Escape"){e.preventDefault();close()}});
  p.addEventListener("click",function(e){e.stopPropagation()});
  document.addEventListener("pointerdown",function(e){if(b.classList.contains("seeding")&&!p.contains(e.target))close()},true); // tapping elsewhere closes the field
})();
</script>
